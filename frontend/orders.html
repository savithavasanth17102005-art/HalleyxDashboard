<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Place Order</title>
<style>
body, html {
  margin:0; padding:0;
  font-family:'Segoe UI', sans-serif;
  min-height:100vh;
  background: linear-gradient(to bottom, #a0e7ff, #80dfff);
  display:flex; justify-content:center; align-items:flex-start;
  padding-top:40px; overflow-x:hidden;
}

.container {
  background: rgba(255,255,255,0.9);
  backdrop-filter: blur(10px);
  padding:40px;
  border-radius:14px;
  width:90vw; max-width:800px;
  box-shadow:0 10px 25px rgba(0,0,0,0.15);
  display:flex; flex-direction:column; gap:15px;
  transition: all 0.4s ease;
}

h3 { text-align:center; color:#034f84; margin-bottom:20px; }

.input-group {
  display:flex; flex-direction:column; gap:6px;
  opacity:0; transform: translateY(20px);
  animation: fadeInUp 0.5s forwards;
}
.input-group:nth-child(1) { animation-delay: 0.2s; }
.input-group:nth-child(2) { animation-delay: 0.4s; }
.input-group:nth-child(3) { animation-delay: 0.6s; }
.input-group:nth-child(4) { animation-delay: 0.8s; }
.input-group:nth-child(5) { animation-delay: 1s; }
.input-group:nth-child(6) { animation-delay: 1.2s; }
.input-group:nth-child(7) { animation-delay: 1.4s; }
.input-group:nth-child(8) { animation-delay: 1.6s; }
.input-group:nth-child(9) { animation-delay: 1.8s; }
.input-group:nth-child(10){ animation-delay:2s; }
.input-group:nth-child(11){ animation-delay:2.2s; }
.input-group:nth-child(12){ animation-delay:2.4s; }

.input-group label { font-weight:600; color:#034f84; }
.input-group input, .input-group select {
  padding:12px; border-radius:8px; border:1px solid #ccc; font-size:16px;
  transition: all 0.3s ease;
}
.input-group input:focus, .input-group select:focus {
  outline:none; border-color:#0ea5e9;
  box-shadow:0 4px 15px rgba(14,165,233,0.3);
}

.btn {
  padding:10px 18px;
  border:none;
  background: linear-gradient(135deg,#54bd95,#0ea5e9);
  color:white;
  border-radius:6px;
  cursor:pointer;
  font-weight:600;
  transition:0.3s;
  box-shadow:0 3px 8px rgba(0,0,0,0.2);
}
.btn:hover {  transform:scale(1.05); }

@keyframes fadeInUp { from {opacity:0; transform:translateY(20px);} to {opacity:1; transform:translateY(0);} }
</style>
</head>
<body>

<div class="container">
  <h3>Place Customer Order</h3>

  <div class="input-group"><label>First Name</label><input id="firstName" placeholder="First Name"></div>
  <div class="input-group"><label>Last Name</label><input id="lastName" placeholder="Last Name"></div>
  <div class="input-group"><label>Email</label><input id="email" type="email" placeholder="Email"></div>
  <div class="input-group"><label>Phone Number</label><input id="phone" placeholder="Phone Number"></div>
  <div class="input-group"><label>Street Address</label><input id="address" placeholder="Street Address"></div>
  <div class="input-group"><label>City</label><input id="city" placeholder="City"></div>
  <div class="input-group"><label>State / Province</label><input id="state" placeholder="State / Province"></div>
  <div class="input-group"><label>Postal Code</label><input id="postal" placeholder="Postal Code"></div>
  <div class="input-group"><label>Country</label>
    <select id="country">
      <option>United States</option>
      <option>Canada</option>
      <option>Australia</option>
      <option>Singapore</option>
      <option>Hong Kong</option>
      <option>India</option>
      <option>United Kingdom</option>
      <option>Germany</option>
      <option>France</option>
      <option>Japan</option>
      <option>Brazil</option>
      <option>Mexico</option>
    </select>
  </div>
  <div class="input-group"><label>Quantity</label><input id="quantity" type="number" value="1" min="1"></div>
  <div class="input-group"><label>Total Amount ($)</label><input id="total" type="number" readonly></div>

  <button class="btn" onclick="placeOrder()">Place Order</button>
</div>

<script>
const quantity = document.getElementById('quantity');
const total = document.getElementById('total');
const defaultPrice = 50;

function updateTotal(){
  const q = parseFloat(quantity.value) || 0;
  total.value = (q * defaultPrice).toFixed(2);
}
quantity.addEventListener('input', updateTotal);
updateTotal();

function placeOrder(){

  console.log("BUTTON CLICKED");
let selectedProduct = JSON.parse(localStorage.getItem('selectedProduct') || '{}');
  const order = {
    firstName: document.getElementById('firstName').value,
    lastName: document.getElementById('lastName').value,
    email: document.getElementById('email').value,
    phone: document.getElementById('phone').value,
    address: document.getElementById('address').value,
    city: document.getElementById('city').value,
    state: document.getElementById('state').value,
    postal: document.getElementById('postal').value,
    country: document.getElementById('country').value,
    quantity: parseFloat(document.getElementById('quantity').value),
    total: parseFloat(document.getElementById('total').value),
    product: selectedProduct.name || "Unknown Product"
  };

  console.log(order);

  if(!order.firstName || !order.lastName || !order.email){
    alert('Please fill all mandatory fields!');
    return;
  }

  
  fetch("http://localhost:3000/add-order", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(order)
  })
  .then(res => res.json())
  .then(data => {

    console.log("Server response:", data);

    if(data.success){

      
      sessionStorage.setItem('orderDetails', JSON.stringify(order));

      window.location.href = 'order-summary.html';

    }else{
      alert("Failed to save order");
    }

  })
  .catch(err => {
    console.error("Fetch error:", err);
    alert("Server error");
  });

}
</script>

</body>
</html>
