<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Summary</title>
<style>
body, html {
  margin:0; padding:0;
  font-family:'Segoe UI', sans-serif;
  min-height:100vh;
  background: linear-gradient(to bottom, #a0e7ff, #80dfff);
  display:flex; justify-content:center; align-items:center;
  overflow-x:hidden;
}

.summary-container {
  background: rgba(232, 249, 255, 0.95);
  padding:40px;
  border-radius:16px;
  width:90vw; max-width:600px;
  box-shadow:0 10px 25px rgba(0,0,0,0.25);
  display:flex; flex-direction:column; gap:20px;
  opacity:0; transform: translateY(30px);
  animation: slideFadeIn 0.7s forwards;
}

h2 { color:#024978; text-align:center; font-size:1.8em; margin:0; }

.details {
  display:flex; flex-direction:column; gap:10px;
  background: rgba(255,255,255,0.8); padding:20px; border-radius:12px;
  box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

.details p { margin:4px 0; font-weight:500; color:#034f84; }

.btn-home {
   padding:10px 18px;
  border:none;
  background: linear-gradient(135deg,#54bd95,#0ea5e9);
  color:white;
  border-radius:6px;
  cursor:pointer;
  font-weight:600;
  transition:0.3s;
  box-shadow:0 3px 8px rgba(0,0,0,0.2);
}
.btn-home:hover {  transform:scale(1.05); }

@keyframes slideFadeIn { from {opacity:0; transform:translateY(30px);} to {opacity:1; transform:translateY(0);} }

</style>
</head>
<body>
  
<div class="wave-bg">
  <div class="wave wave1"></div>
  <div class="wave wave2"></div>
  <div class="wave wave3"></div>
</div>
<div class="summary-container">
  <h2>🎉 Order Successfully Placed!</h2>
  <div class="details" id="orderDetails"></div>
  <button class="btn-home" onclick="goHome()">Back to Details</button>
</div>

<script>

const order = JSON.parse(sessionStorage.getItem('orderDetails'));
const detailsDiv = document.getElementById('orderDetails');

if(order){
  detailsDiv.innerHTML = `
    <p><strong>Product:</strong> ${order.product}</p>
    <p><strong>Name:</strong> ${order.firstName} ${order.lastName}</p>
    <p><strong>Email:</strong> ${order.email}</p>
    <p><strong>Phone:</strong> ${order.phone}</p>
    <p><strong>Address:</strong> ${order.address}, ${order.city}, ${order.state}, ${order.postal}, ${order.country}</p>
    <p><strong>Quantity:</strong> ${order.quantity}</p>
    <p><strong>Total Amount:</strong> $${parseFloat(order.total).toFixed(2)}</p>
  `;
} else {
  detailsDiv.innerHTML = "<p>No order details found.</p>";
}

function goHome(){
  sessionStorage.removeItem('orderDetails');
  window.location.href = 'user.html';
}
</script>

</body>
</html>
