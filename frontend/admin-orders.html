<!DOCTYPE html>
<html>
<head>
<title>Customer Orders</title>
<link rel="stylesheet" href="css/style.css">

<style>

/* PAGE BACKGROUND */
body{
  background: linear-gradient(135deg, #a0e7ff, #80dfff);
  font-family: 'Segoe UI', sans-serif;
  margin:0;
}

/* TOPBAR FIX */
.topbar{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:80px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 25px;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(15px);
  box-shadow:0 5px 15px rgba(0,0,0,0.15);
  border-bottom:2px solid #54bd95;
  z-index:1000;
}

/* TABLE CARD */
.table-container{
  margin-top:120px;
  padding:30px;
}

table{
  width:100%;
  border-collapse:separate;
  border-spacing:0 10px; /* gap between rows */
  border-radius:12px;
  overflow:hidden;
}

/* HEADER */
th{
  background:#20b2aa; /* keep your teal */
  color:white;
  padding:14px;
  text-align:left;
  font-weight:600;
}

/* APPLY COLOR TO LAST HEADER ALSO */
th:last-child{
  text-align:center;
  width:60px;
}

/* ROW STYLE (CARD LOOK) */
tr{
  background:white;
  box-shadow:0 5px 12px rgba(0,0,0,0.1);
  border-radius:10px;
  overflow:hidden;
}

/* ROUND CORNERS */
tr td:first-child{
  border-top-left-radius:10px;
  border-bottom-left-radius:10px;
}

tr td:last-child{
  border-top-right-radius:10px;
  border-bottom-right-radius:10px;
  text-align:center;
}
td:last-child{
  background:white; /* same as row */
}

/* CELLS */
td{
  padding:14px;
  border:none;
}
td {
  max-width: 200px;
  word-wrap: break-word;
}

/* HOVER */
tr:hover{
  transform:scale(1.01);
  background:#f5fbff;
}

/* DELETE ICON */
.delete-icon{
  cursor:pointer;
  font-size:18px;
  transition:0.3s;
  display:inline-block;
}

.delete-icon:hover{
  color:#ff4d4d;
  transform:scale(1.3);
}

/* DELETE ANIMATION */
.fade-out{
  opacity:0;
  transform:translateX(50px);
  transition:0.4s ease;
}

</style>
</head>

<body>

<div class="topbar">
  <h3>Customer Orders</h3>
  <button onclick="goBack()">← Back</button>
</div>

<div class="table-container">
<table border="1" width="100%" style="background:white; border-collapse:collapse">
<thead>
<tr>
<th>Name</th>
<th>Email</th>
<th>Product</th>
<th>Quantity</th>
<th>Total</th>
<th>City</th>
<th>Phone</th>
<th>Address</th>
<th></th>
</tr>
</thead>

<tbody id="ordersTable"></tbody>

</table>

</div>

<script>

function loadOrders(){

fetch("http://localhost:3000/orders")
.then(res => res.json())
.then(orders => {

let table = document.getElementById("ordersTable");
table.innerHTML = "";

if(orders.length === 0){
table.innerHTML = "<tr><td colspan='7'>No orders found</td></tr>";
return;
}

orders.forEach((o)=>{

table.innerHTML += `
<tr id="row-${o.id}">
<td>${o.firstName} ${o.lastName}</td>
<td>${o.email}</td>
<td>${o.product}</td>
<td>${o.quantity}</td>
<td>${o.total}</td>
<td>${o.city}</td>
<td>${o.phone}</td>
<td>${o.address}</td>

<td style="text-align:center;">
  <span class="delete-icon" onclick="deleteOrder(${o.id})">✖</span>
</td>
</tr>
`;

});

})
.catch(err=>{
console.error(err);
alert("Failed to load orders");
});

}


function goBack(){
window.location.href = "dashboard.html";
}

function deleteOrder(id){

  if(!confirm("Delete this order?")) return;

  fetch(`http://localhost:3000/delete-order/${id}`, {
    method: "DELETE"
  })
  .then(res => res.json())
  .then(data => {

    console.log("Delete response:", data);

    if(data.success){
      loadOrders(); // 🔥 refresh table (no blank space)
    }else{
      alert("Delete failed");
    }

  })
  .catch(err=>{
    console.error("Delete error:", err);
    alert("Server error");
  });

}

loadOrders();

</script>

</body>
</html>
